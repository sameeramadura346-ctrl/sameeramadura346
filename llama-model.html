<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Llama AI - Gemini Style</title>
    <!-- Google Fonts for Inter (Open Sans alternative) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="templatemo-electric-xtra.css" rel="stylesheet">
    <style>
        :root {
            --bg-body: #131314;
            --bg-sidebar: #1e1f20;
            --bg-surface: #1e1f20;
            --bg-input: #282a2c;
            --text-primary: #e3e3e3;
            --text-secondary: #c4c7c5;
            --accent-blue: #a8c7fa;
            --border-color: #444746;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            padding: 20px 10px;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .new-chat-btn {
            background-color: #1a1b1e;
            /* Slightly darker */
            color: #bdc1c6;
            border: 1px solid transparent;
            border-radius: 20px;
            padding: 10px 15px;
            margin-top: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background 0.2s;
            width: 140px;
        }

        .new-chat-btn:hover {
            background-color: #2b2c30;
        }

        .sidebar-section {
            margin-bottom: 20px;
        }

        .sidebar-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            padding: 0 10px;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 20px;
            cursor: pointer;
            color: var(--text-primary);
            font-size: 0.9rem;
            text-decoration: none;
        }

        .sidebar-item:hover {
            background-color: #2b2c30;
        }

        .bottom-links {
            margin-top: auto;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: var(--bg-body);
            border-radius: 20px 0 0 20px;
            /* Slight roundness if desired, regular gemini is flat edge */
            overflow: hidden;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            font-size: 1.1rem;
            color: var(--text-secondary);
        }

        .model-selector {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .model-selector:hover {
            color: var(--text-primary);
        }

        .user-profile {
            width: 32px;
            height: 32px;
            background: linear-gradient(45deg, #FF5E00, #00B2FF);
            border-radius: 50%;
            cursor: pointer;
        }

        /* Center / Chat Area */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* Initial center */
            padding: 0 20px;
            overflow-y: auto;
        }

        .welcome-container {
            text-align: left;
            width: 100%;
            max-width: 800px;
            margin-bottom: 40px;
            transition: opacity 0.3s ease;
        }

        .greeting-text {
            font-size: 3.5rem;
            font-weight: 500;
            letter-spacing: -1px;
            line-height: 1.2;
            background: linear-gradient(90deg, #4285F4, #9B72CB, #b6d3ff);
            /* Gemini-ish gradient */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .sub-greeting {
            font-size: 3.5rem;
            font-weight: 500;
            color: #444746;
            /* Dull grey for second line */
        }

        /* Active Chat State */
        .chat-history {
            width: 100%;
            max-width: 800px;
            display: none;
            /* Hidden initially */
            flex-direction: column;
            gap: 30px;
            padding-bottom: 150px;
            /* Space for input */
            margin-top: 20px;
        }

        .message-row {
            display: flex;
            gap: 15px;
            width: 100%;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        /* Gemini style: User messages are grey pills, Bot messages are transparent/text */
        .msg-bubble {
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 1rem;
            line-height: 1.6;
            max-width: 80%;
        }

        .msg-bubble.user {
            background-color: #282a2c;
            color: #e3e3e3;
            border-bottom-right-radius: 4px;
        }

        .msg-bubble.bot {
            background-color: transparent;
            color: #c4c7c5;
            padding-left: 0;
            display: flex;
            gap: 10px;
            flex-direction: column;
        }

        /* Input Area */
        .input-region {
            width: 100%;
            max-width: 800px;
            position: absolute;
            bottom: 30px;
            left: 50%;
            /* Center horizontally */
            transform: translateX(-50%);
            /* Adjust to true center */
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: all 0.5s ease;
        }

        /* When chat is active, we might want to keep it at bottom but remove centering greeting */

        .input-box {
            background-color: var(--bg-input);
            border-radius: 30px;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid transparent;
            /* Highlight on focus? */
        }

        .input-box:focus-within {
            background-color: #303134;
        }

        .input-field {
            background: transparent;
            border: none;
            color: white;
            font-size: 1.1rem;
            resize: none;
            outline: none;
            font-family: 'Inter', sans-serif;
            height: 24px;
            max-height: 150px;
        }

        .input-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-icons {
            display: flex;
            gap: 15px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .send-btn-circle {
            background: white;
            color: black;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            opacity: 0.5;
            /* Disabled look initally */
        }

        .send-btn-circle.active {
            opacity: 1;
        }

        .suggestion-chips {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .chip {
            background-color: #1e1f20;
            color: var(--text-secondary);
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
            border: 1px solid #444746;
        }

        .chip:hover {
            background-color: #2b2c30;
        }

        /* SVG Icons */
        svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            /* Mobile Menu would be needed, strict rewrite for now */
            .greeting-text,
            .sub-greeting {
                font-size: 2.5rem;
            }
        }

        /* Utility to hide things */
        .hidden {
            display: none !important;
        }

        .visible {
            display: flex !important;
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <button class="menu-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
                </svg>
            </button>
        </div>

        <button class="new-chat-btn" onclick="resetChat()">
            <svg viewBox="0 0 24 24" style="width:18px;height:18px;">
                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
            </svg>
            New chat
        </button>

        <div class="sidebar-section">
            <div class="sidebar-label">Recent</div>
            <a href="#" class="sidebar-item">
                <svg viewBox="0 0 24 24" style="width:16px;height:16px;">
                    <path
                        d="M20 2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z" />
                </svg>
                Help with CSS
            </a>
            <a href="#" class="sidebar-item">
                <svg viewBox="0 0 24 24" style="width:16px;height:16px;">
                    <path
                        d="M20 2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z" />
                </svg>
                Llama 3 Specs
            </a>
        </div>

        <div class="bottom-links">
            <a href="#" class="sidebar-item">
                <svg viewBox="0 0 24 24" style="width:18px;height:18px;">
                    <path
                        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z" />
                </svg>
                Help
            </a>
            <a href="#" class="sidebar-item">
                <svg viewBox="0 0 24 24" style="width:18px;height:18px;">
                    <path
                        d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.5l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.32.24.5.49.5h4c.25 0 .46-.18.49-.5l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z" />
                </svg>
                Settings
            </a>
            <!-- Back to Home Button added for navigation safety -->
            <a href="index.html" class="sidebar-item" style="color: #a8c7fa;">
                <svg viewBox="0 0 24 24">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
                </svg>
                Back to Site
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Top Bar -->
        <header class="top-bar">
            <div class="model-selector">
                Llama 3 Instruct
                <svg viewBox="0 0 24 24" style="width:16px;height:16px;">
                    <path d="M7 10l5 5 5-5z" />
                </svg>
            </div>
            <div class="user-profile"></div>
        </header>

        <!-- Scrollable Content Area -->
        <div class="content-area" id="contentArea">

            <!-- Welcome / Empty State -->
            <div class="welcome-container" id="welcomeContainer">
                <div class="greeting-text">Hi, User</div>
                <div class="sub-greeting">Where should we start?</div>
            </div>

            <!-- Chat History (Hidden initially) -->
            <div class="chat-history" id="chatHistory">
                <!-- Messages go here -->
            </div>

        </div>

        <!-- Input Region (Stays fixed or moves) -->
        <div class="input-region" id="inputRegion">
            <!-- Suggestion Chips (Visible only in empty state initially) -->
            <div class="suggestion-chips" id="suggestionChips">
                <div class="chip" onclick="sendPrompt('Create an image of a cyber city')">Create image</div>
                <div class="chip" onclick="sendPrompt('Draft an email to my boss')">Write email</div>
                <div class="chip" onclick="sendPrompt('Give me a python code example')">Code snippet</div>
                <div class="chip" onclick="sendPrompt('Explain quantum physics')">Help me learn</div>
            </div>

            <div class="input-box">
                <input type="text" class="input-field" id="userInput" placeholder="Ask Llama 3"
                    onkeypress="handleKeyPress(event)" autocomplete="off">
                <div class="input-actions">
                    <div class="action-icons">
                        <button class="icon-btn" title="Upload Image">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z" />
                            </svg>
                        </button>
                        <button class="icon-btn" title="Use Microphone">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" />
                                <path
                                    d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
                            </svg>
                        </button>
                    </div>
                    <button class="send-btn-circle" id="sendBtn" onclick="sendMessage()">
                        <svg viewBox="0 0 24 24" style="fill: currentcolor; width: 16px; transform: rotate(-0deg);">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div style="text-align: center; font-size: 0.75rem; color: #444746; padding-top: 10px;">
                Llama may display inaccurate info, including about people, so double-check its responses.
            </div>
        </div>
    </main>

    <script>
        const chatHistory = document.getElementById('chatHistory');
        const welcomeContainer = document.getElementById('welcomeContainer');
        const contentArea = document.getElementById('contentArea');
        const userInput = document.getElementById('userInput');
        const suggestionChips = document.getElementById('suggestionChips');
        const sendBtn = document.getElementById('sendBtn');
        let hasStartedChat = false;

        userInput.addEventListener('input', () => {
            if (userInput.value.trim().length > 0) {
                sendBtn.classList.add('active');
                sendBtn.style.opacity = '1';
            } else {
                sendBtn.classList.remove('active');
                sendBtn.style.opacity = '0.5';
            }
        });

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendPrompt(text) {
            userInput.value = text;
            sendMessage();
        }

        function resetChat() {
            hasStartedChat = false;
            chatHistory.innerHTML = '';
            chatHistory.style.display = 'none';
            welcomeContainer.style.display = 'block';
            suggestionChips.style.display = 'flex';
            contentArea.style.justifyContent = 'center';
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Transition to Chat State if first message
            if (!hasStartedChat) {
                hasStartedChat = true;
                welcomeContainer.style.display = 'none';
                suggestionChips.style.display = 'none';
                chatHistory.style.display = 'flex';
                contentArea.style.justifyContent = 'flex-start'; // Align top
            }

            // User Message
            addMessage(text, 'user');
            userInput.value = '';

            // Mock API Response
            const response = await callLlamaAPI(text);

            addMessage(response, 'bot');
        }

        function addMessage(text, sender) {
            const row = document.createElement('div');
            row.className = `message-row ${sender}`;

            const bubble = document.createElement('div');
            bubble.className = `msg-bubble ${sender}`;

            if (sender === 'bot') {
                // Add Icon for bot
                const icon = document.createElement('div');
                icon.innerHTML = '✨'; // Sparkle icon
                bubble.appendChild(icon);

                const textSpan = document.createElement('span');
                textSpan.textContent = text;
                bubble.appendChild(textSpan);
            } else {
                bubble.textContent = text;
            }

            row.appendChild(bubble);
            chatHistory.appendChild(row);

            // Scroll to bottom
            contentArea.scrollTop = contentArea.scrollHeight;
        }

        async function callLlamaAPI(prompt) {
            return new Promise(resolve => {
                setTimeout(() => {
                    const responses = [
                        "I can certainly help you with that.",
                        "Here's what I found based on your request.",
                        "That's a creative idea! Let's explore it.",
                        "Llama 3 is optimized for this kind of task.",
                        "I've generated a draft for you."
                    ];
                    const randomResponse = responses[Math.floor(Math.random() * responses.length)];
                    resolve(randomResponse);
                }, 1000);
            });
        }
    </script>
</body>

</html>
